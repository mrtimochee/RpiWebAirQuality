<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151e"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#212638" stroke-width="8"/>

  <!-- Glowing Air Waves -->
  <g filter="url(#glow)">
    <!-- Top breeze wave -->
    <path d="M 120 180 C 180 140, 260 140, 310 180 C 340 205, 380 205, 400 180 C 415 160, 400 135, 375 140 C 355 144, 345 165, 360 175"
          fill="none" stroke="url(#windGrad)" stroke-width="26" stroke-linecap="round"/>

    <!-- Middle breeze wave -->
    <path d="M 90 256 C 160 210, 240 220, 280 256 C 310 280, 350 285, 380 260 C 400 240, 390 215, 365 220 C 345 224, 340 245, 355 255"
          fill="none" stroke="url(#windGrad)" stroke-width="24" stroke-linecap="round" opacity="0.85"/>

    <!-- Bottom breeze wave -->
    <path d="M 140 330 C 190 310, 240 315, 275 340"
          fill="none" stroke="url(#windGrad)" stroke-width="22" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Eco Leaf Emblem (Center-Right overlay) -->
  <g transform="translate(195, 175) scale(0.68)" filter="url(#glow)">
    <path d="M 260 40 C 130 50, 40 170, 40 300 C 40 320, 50 340, 70 340 C 190 340, 330 250, 340 90 C 340 50, 300 35, 260 40 Z"
          fill="url(#leafGrad)"/>
    <!-- Leaf Stem / Vein -->
    <path d="M 60 330 C 120 290, 190 220, 280 100"
          fill="none" stroke="#a7f3d0" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
    <path d="M 140 255 C 190 265, 230 245, 250 230"
          fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" opacity="0.65"/>
    <path d="M 195 190 C 235 195, 265 180, 280 165"
          fill="none" stroke="#a7f3d0" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Status Pulse Dot -->
  <circle cx="410" cy="102" r="18" fill="#10b981" filter="url(#glow)"/>
  <circle cx="410" cy="102" r="8" fill="#ffffff"/>
</svg>
